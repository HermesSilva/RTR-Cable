# RTR-Cable - builds the driver package (x64, Release) with the Windows
# Driver Kit of the runner and test-signs it with a certificate made for the
# run. The artifact is what scripts\install.ps1 installs on a computer in
# test-signing mode.
name: build

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  driver:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: microsoft/setup-msbuild@v2
        with:
          msbuild-architecture: x64

      - name: Show the INF verification step of the kit
        shell: pwsh
        continue-on-error: true
        run: |
          $f = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kitsuild\*\WindowsDriver.common.targets" | Select-Object -Last 1
          (Get-Content $f.FullName)[660..700]
          Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits" -Recurse -Filter InfVerif.dll -ErrorAction SilentlyContinue | ForEach-Object FullName

      - name: Build the driver
        shell: pwsh
        run: scripts\build.ps1 -Sign

      - uses: actions/upload-artifact@v4
        with:
          name: rtr-cable-x64
          path: package/
          if-no-files-found: error
